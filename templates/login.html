<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Sign In - MANAS AI</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style type="text/tailwindcss">
        :root {
            --primary: #C3B1E1;
            --background: #F6F6F8;
            --dark-slate: #2D3748;
        }
        @layer components {
            .glass-card {
                background: rgba(255, 255, 255, 0.8);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.3);
            }
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#C3B1E1",
                        "background": "#F6F6F8",
                        "dark-slate": "#2D3748",
                    },
                    fontFamily: {
                        "sans": ["Inter", "sans-serif"]
                    },
                },
            },
        };
    </script>
</head>
<body class="font-sans bg-background text-dark-slate">
    <div class="flex h-screen w-full items-center justify-center p-4">
        <div class="w-full max-w-md glass-card rounded-[2rem] shadow-2xl shadow-primary/10 p-10">
            
            <div class="flex flex-col items-center mb-10">
                <div class="flex items-center gap-3 mb-6">
                    <div class="bg-primary p-2 rounded-xl text-white flex items-center justify-center shadow-lg shadow-primary/30">
                        <span class="material-symbols-outlined text-2xl">spa</span>
                    </div>
                    <h1 class="text-2xl font-extrabold tracking-tighter uppercase text-slate-800">MANAS AI</h1>
                </div>
                <h2 class="text-xl font-bold text-slate-800">Welcome Back</h2>
                <p class="text-sm text-slate-500 mt-1">Please enter your details to continue</p>
            </div>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="mb-4 space-y-2">
                {% for category, m in messages %}
                <div class="rounded-xl px-4 py-3 text-xs font-semibold {% if category == 'login' %}bg-red-50 border border-red-200 text-red-700{% else %}bg-amber-50 border border-amber-200 text-amber-800{% endif %}">
                    {{ m }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form class="space-y-5" method="POST" action="/login">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 ml-1" for="email">Email Address</label>
                    <input class="w-full px-5 py-4 bg-white/50 border-none rounded-2xl shadow-sm focus:ring-2 focus:ring-primary transition-all placeholder:text-slate-300" id="email" name="email" placeholder="name@domain.com" type="email" required />
                </div>

                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 ml-1" for="password">Password</label>
                    <div class="relative">
                        <input class="w-full px-5 py-4 bg-white/50 border-none rounded-2xl shadow-sm focus:ring-2 focus:ring-primary transition-all pr-12 placeholder:text-slate-300" id="password" name="password" placeholder="••••••••" type="password" required />
                        <button type="button" class="absolute inset-y-0 right-0 px-4 flex items-center text-slate-400 hover:text-primary transition-colors" onclick="togglePassword()">
                            <span id="password-toggle-icon" class="material-symbols-outlined text-xl">visibility_off</span>
                        </button>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full py-4 px-6 bg-primary text-white rounded-2xl font-bold uppercase tracking-widest text-xs shadow-lg shadow-primary/40 hover:scale-[1.02] active:scale-[0.98] transition-all">
                        Sign In
                    </button>
                </div>
            </form>

            <p class="mt-8 text-center text-xs font-medium text-slate-500">
                New to the platform? 
                <a class="text-primary font-bold hover:underline" href="/signup">Create account</a>
            </p>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById("password");
            const icon = document.getElementById("password-toggle-icon");
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                icon.textContent = "visibility";
            } else {
                passwordInput.type = "password";
                icon.textContent = "visibility_off";
            }
        }
    </script>
</body>
</html>
