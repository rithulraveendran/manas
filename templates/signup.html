<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Sign Up - MANAS AI</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style type="text/tailwindcss">
        :root {
            --primary: #C3B1E1;
            --background: #F6F6F8;
            --dark-slate: #2D3748;
        }
        @layer components {
            .glass-card {
                background: rgba(255, 255, 255, 0.8);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.3);
            }
            .dp-preview {
                background-size: cover;
                background-position: center;
            }
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#C3B1E1",
                        "background": "#F6F6F8",
                        "dark-slate": "#2D3748",
                    },
                    fontFamily: {
                        "sans": ["Inter", "sans-serif"]
                    },
                },
            },
        };
    </script>
</head>
<body class="font-sans bg-background text-dark-slate">
    <div class="flex min-h-screen w-full items-center justify-center p-6">
        <div class="w-full max-w-md glass-card rounded-[2.5rem] shadow-2xl shadow-primary/10 p-10 my-8">
            
            <div class="flex flex-col items-center mb-8">
                <div class="flex items-center gap-3 mb-6">
                    <div class="bg-primary p-2 rounded-xl text-white flex items-center justify-center shadow-lg shadow-primary/30">
                        <span class="material-symbols-outlined text-2xl">spa</span>
                    </div>
                    <h1 class="text-2xl font-extrabold tracking-tighter uppercase text-slate-800">MANAS AI</h1>
                </div>
                <h2 class="text-xl font-bold text-slate-800">Create Account</h2>
                <p class="text-sm text-slate-500 mt-1">Start your journey to mental clarity</p>
            </div>
            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="mb-4 space-y-2">
                {% for m in messages %}
                <div class="rounded-xl bg-amber-50 border border-amber-200 px-4 py-3 text-xs font-semibold text-amber-800">{{ m }}</div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form class="space-y-4" method="POST" action="/signup" enctype="multipart/form-data">
                
                <div class="flex flex-col items-center mb-6">
                    <div class="relative group">
                        <div id="imagePreview" class="size-24 rounded-full bg-slate-100 border-4 border-white shadow-md flex items-center justify-center overflow-hidden dp-preview text-slate-300">
                            <span id="previewIcon" class="material-symbols-outlined text-4xl">account_circle</span>
                        </div>
                        <label for="dp-input" class="absolute bottom-0 right-0 bg-primary text-white p-1.5 rounded-full cursor-pointer shadow-lg hover:scale-110 transition-transform">
                            <span class="material-symbols-outlined text-sm">edit</span>
                            <input type="file" id="dp-input" name="profile_picture" class="hidden" accept="image/*" onchange="previewImage(event)">
                        </label>
                    </div>
                    <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 mt-3">Upload Profile Picture</p>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1.5 ml-1" for="name">Name</label>
                        <input class="w-full px-4 py-3 bg-white/50 border-none rounded-2xl shadow-sm focus:ring-2 focus:ring-primary transition-all placeholder:text-slate-300" id="name" name="name" placeholder="John" type="text" required />
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1.5 ml-1" for="age">Age</label>
                        <input class="w-full px-4 py-3 bg-white/50 border-none rounded-2xl shadow-sm focus:ring-2 focus:ring-primary transition-all placeholder:text-slate-300" id="age" name="age" placeholder="24" type="number" required />
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1.5 ml-1" for="email">Email</label>
                    <input class="w-full px-4 py-3 bg-white/50 border-none rounded-2xl shadow-sm focus:ring-2 focus:ring-primary transition-all placeholder:text-slate-300" id="email" name="email" placeholder="name@domain.com" type="email" required />
                </div>

                <div class="relative">
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1.5 ml-1" for="password">Password</label>
                    <input class="w-full px-4 py-3 bg-white/50 border-none rounded-2xl shadow-sm focus:ring-2 focus:ring-primary transition-all pr-12 placeholder:text-slate-300" id="password" name="password" placeholder="••••••••" type="password" required />
                    <button type="button" class="absolute right-0 top-[34px] px-4 flex items-center text-slate-400 hover:text-primary transition-colors" onclick="togglePassword('password', this)">
                        <span class="material-symbols-outlined text-xl">visibility_off</span>
                    </button>
                </div>

                <div class="relative">
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1.5 ml-1" for="confirm-password">Confirm Password</label>
                    <input class="w-full px-4 py-3 bg-white/50 border-none rounded-2xl shadow-sm focus:ring-2 focus:ring-primary transition-all pr-12 placeholder:text-slate-300" id="confirm-password" name="confirm-password" placeholder="••••••••" type="password" required />
                    <button type="button" class="absolute right-0 top-[34px] px-4 flex items-center text-slate-400 hover:text-primary transition-colors" onclick="togglePassword('confirm-password', this)">
                        <span class="material-symbols-outlined text-xl">visibility_off</span>
                    </button>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full py-4 px-6 bg-primary text-white rounded-2xl font-bold uppercase tracking-widest text-xs shadow-lg shadow-primary/40 hover:scale-[1.02] active:scale-[0.98] transition-all">
                        Create Account
                    </button>
                </div>
            </form>

            <p class="mt-8 text-center text-xs font-medium text-slate-500">
                Already have an account? 
                <a class="text-primary font-bold hover:underline" href="/login">Log in</a>
            </p>
        </div>
    </div>

    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('span');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = "visibility";
            } else {
                input.type = 'password';
                icon.textContent = "visibility_off";
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const allowed = ['image/png', 'image/jpeg', 'image/webp'];
            if (!allowed.includes(file.type)) {
                alert('Please select PNG, JPG, JPEG, or WEBP image.');
                event.target.value = '';
                return;
            }
            if (file.size > 5 * 1024 * 1024) {
                alert('Image too large. Max allowed is 5 MB.');
                event.target.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('imagePreview');
                const icon = document.getElementById('previewIcon');
                output.style.backgroundImage = `url('${reader.result}')`;
                icon.style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
