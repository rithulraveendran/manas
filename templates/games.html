<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>MANAS AI - Game Center</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style type="text/tailwindcss">
        :root {
            --primary: #C3B1E1;
            --background: #F6F6F8;
            --dark-slate: #2D3748;
        }
        @layer components {
            .glass-header {
                background: rgba(246, 246, 248, 0.7);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
            }
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#C3B1E1",
                        "background": "#F6F6F8",
                        "dark-slate": "#2D3748",
                    },
                    fontFamily: {
                        "sans": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "32": "32px",
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background font-sans text-dark-slate min-h-screen flex flex-col">
    <header class="glass-header sticky top-0 z-50 flex items-center justify-between px-8 py-2 border-b border-slate-200/60 h-14">
        <div class="flex items-center gap-3">
            <div class="bg-primary p-1.5 rounded-lg text-white flex items-center justify-center">
                <span class="material-symbols-outlined text-xl">spa</span>
            </div>
            <h1 class="text-lg font-extrabold tracking-tighter uppercase text-slate-800">MANAS AI</h1>
        </div>
        
        <div class="flex items-center gap-4">
            <a href="/chat" class="p-2 text-slate-400 hover:text-primary transition-colors flex items-center justify-center">
                <span class="material-symbols-outlined text-xl">chat</span>
            </a>
            <div class="h-6 w-px bg-slate-200"></div>
            <a href="/account" class="size-8 rounded-full border-2 border-primary overflow-hidden hover:scale-105 transition-transform">
                <img src="{{ profile_photo_url }}" class="w-full h-full object-cover" alt="Profile">
            </a>
            <button id="logoutBtn" class="p-2 text-slate-400 hover:text-slate-600 transition-colors flex items-center justify-center">
                <span class="material-symbols-outlined text-xl">logout</span>
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-6 md:p-8 lg:p-12">
        <div class="w-full max-w-5xl mx-auto">
            <div class="mb-12 text-center">
                <h2 class="text-4xl md:text-5xl font-black tracking-tight text-dark-slate mb-4">Choose a Game to Play</h2>
                <p class="text-slate-500 font-medium">Relax and sharpen your mind with our curated collection.</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <a class="group relative flex flex-col items-center justify-center p-8 bg-white rounded-32 border border-slate-100 shadow-sm hover:shadow-2xl hover:-translate-y-2 transition-all duration-300" href="/game1">
                    <div class="absolute inset-0 bg-gradient-to-br from-primary/80 to-[#A084D1] rounded-32 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                    <div class="relative flex flex-col items-center text-center z-10">
                        <div class="mb-6 text-primary group-hover:text-white transition-colors duration-300">
                            <span class="material-symbols-outlined !text-7xl">stadia_controller</span>
                        </div>
                        <h4 class="text-xl font-black text-dark-slate group-hover:text-white transition-colors duration-300 uppercase tracking-tight">Snake Game</h4>
                        <p class="text-sm text-slate-500 group-hover:text-white/80 transition-colors duration-300 mt-2 font-medium italic">Classic arcade fun</p>
                    </div>
                </a>

                <a class="group relative flex flex-col items-center justify-center p-8 bg-white rounded-32 border border-slate-100 shadow-sm hover:shadow-2xl hover:-translate-y-2 transition-all duration-300" href="/game2">
                    <div class="absolute inset-0 bg-gradient-to-br from-primary/80 to-[#A084D1] rounded-32 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                    <div class="relative flex flex-col items-center text-center z-10">
                        <div class="mb-6 text-primary group-hover:text-white transition-colors duration-300">
                            <span class="material-symbols-outlined !text-7xl">memory</span>
                        </div>
                        <h4 class="text-xl font-black text-dark-slate group-hover:text-white transition-colors duration-300 uppercase tracking-tight">Memory Game</h4>
                        <p class="text-sm text-slate-500 group-hover:text-white/80 transition-colors duration-300 mt-2 font-medium italic">Test your recall skills</p>
                    </div>
                </a>

                <a class="group relative flex flex-col items-center justify-center p-8 bg-white rounded-32 border border-slate-100 shadow-sm hover:shadow-2xl hover:-translate-y-2 transition-all duration-300" href="/game3">
                    <div class="absolute inset-0 bg-gradient-to-br from-primary/80 to-[#A084D1] rounded-32 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                    <div class="relative flex flex-col items-center text-center z-10">
                        <div class="mb-6 text-primary group-hover:text-white transition-colors duration-300">
                            <span class="material-symbols-outlined !text-7xl">adjust</span>
                        </div>
                        <h4 class="text-xl font-black text-dark-slate group-hover:text-white transition-colors duration-300 uppercase tracking-tight">Focus Ball</h4>
                        <p class="text-sm text-slate-500 group-hover:text-white/80 transition-colors duration-300 mt-2 font-medium italic">Improve concentration</p>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('logoutBtn').onclick = () => { window.location.href = '/logout'; };
    </script>
</body>
</html>
